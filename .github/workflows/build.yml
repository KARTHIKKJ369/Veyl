name: Build and Release Veyl Android App

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare Release APK Asset
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/veyl-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: veyl-debug-apk
          path: app/build/outputs/apk/debug/veyl-debug.apk
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Veyl Latest Build' }}
          body: |
            ## 🎵 Veyl — Reference Audiophile Android Music Player

            ### 🚀 Highlights in this release (v2.1.0):
            - **Custom Equalizer Presets**: Create, save, load, and delete customized 10-band equalizer settings with persistent storage.
            - **Sample Rate & Pitch Stability**: Fixed sample rate synchronization and Rubato resampler error recovery, eliminating unexpected pitch jumps across audio route changes.
            - **Intelligent Phone Call Handling**: Paused songs strictly remain paused after phone calls end; audio focus recovery only resumes music if it was actively playing before the call.
            - **Redesigned Playlists & Collections**: Pinned Favorites, Smart Collections, custom playlist artwork, and elevated bottom navigation bar tab.
            - **Bit-Perfect AAudio MMAP & Direct USB DAC Output**: Pure Rust audio engine (`audiophile-core`) bypassing Android system mixer audio degradation.
            - **100% Free & Open Source**: Licensed under the GNU General Public License v3.0 (GPL-3.0) with zero ads and zero telemetry.

            ### 📥 Download
            Download and install **`veyl-debug.apk`** from the Assets below.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            app/build/outputs/apk/debug/veyl-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
