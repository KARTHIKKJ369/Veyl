name: Build and Release Veyl Android App

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare Release APK Asset
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/veyl-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: veyl-debug-apk
          path: app/build/outputs/apk/debug/veyl-debug.apk
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Veyl Latest Build' }}
          body: |
            ## 🎵 Veyl — Reference Audiophile Android Music Player

            ### 🚀 Highlights in this release (v2.7.0):
            - **Multi-Provider Synchronized Lyrics**: Added YouTube Music InnerTube, NetEase, JioSaavn, and Lyrics.ovh alongside LRCLIB and embedded tags with a minimal borderless provider selector.
            - **Redesigned Lyrics Experience**: Centered Outfit geometric display typography with smooth sync-driven line transitions, clean top toolbar, and auto-hidden transparent "Jump to playing" button shown only during manual scroll.
            - **Dedicated Artist & Album Detail Pages**: Tapping any artist or album opens a full page tracklist with accurate multi-artist and album grouping.
            - **Downloads & MediaStore M3U8 Scanner**: Finds `.m3u8` / `.m3u` playlists in `Download/` and storage automatically via MediaStore and scoped storage fallback.
            - **Unified Clean List & Queue UI**: Borderless header actions, hairline dividers, transparent floating A–Z ribbon fast scroller across all views, and paused playing-bars freeze.
            - **100% Free & Open Source**: Licensed under the GNU General Public License v3.0 (GPL-3.0).

            ### 📥 Download
            Download and install **`veyl-debug.apk`** from the Assets below.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            app/build/outputs/apk/debug/veyl-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
