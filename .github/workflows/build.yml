name: Build and Release Veyl Android App

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare Release APK Asset
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/veyl-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: veyl-debug-apk
          path: app/build/outputs/apk/debug/veyl-debug.apk
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Veyl Latest Build' }}
          body: |
            ## 🎵 Veyl — Audiophile Android Music Player

            ### 🚀 Features & Fixes in this release:
            - **Dedicated Full-Screen Search**: Instant multi-category search across Songs, Artists, and Albums with recent search history and zero-lag indexing.
            - **Collapsible In-Library Quick Filter**: Fast inline filter in Songs screen to quickly isolate tracks without interrupting browsing.
            - **Lifecycle-Aware Performance**: Upgraded to `collectAsStateWithLifecycle` to halt background recompositions and drastically improve battery and CPU efficiency.
            - **Asynchronous Native Engine Execution**: Native audio commands (play, pause, seek, EQ faders, volume) are executed on a dedicated background scope for stutter-free UI smoothness.
            - **Accurate Audio Ducking Restoration**: Audio focus ducking preserves and restores exact prior volume levels rather than resetting to 100%.
            - **Updated Adaptive App Icons**: Polished adaptive launcher icons with multi-density mipmap support.
            - **Audiophile DSP & Pure Rust Engine**: 10-band biquad parametric EQ, high-fidelity resampling, lock-free ring-buffer, and bit-perfect hardware output.

            ### 📥 Download
            Download and install **`veyl-debug.apk`** from the Assets below.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            app/build/outputs/apk/debug/veyl-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
