name: Build and Release Veyl Android App

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble Release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare Release APK Asset
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/veyl-release.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: veyl-release-apk
          path: app/build/outputs/apk/release/veyl-release.apk
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Veyl Latest Release' }}
          body: |
            ## 🎵 Veyl — Reference Audiophile Android Music Player

            ### 🚀 Highlights in v2.9.0:
            - **True Gapless & Equal-Power Crossfade**: Full resampler tail flushing, Linear/Equal-Power/S-Curve overlap mixing, and race-free skip flushing.
            - **WSOLA Time-Stretching & ITU-R Downmix**: Pitch-preserving playback speed and proper 5.1/7.1 → stereo downmixing.
            - **ReplayGain Modes & 24-bit TPDF Dither**: Off/Track/Album ReplayGain with peak clipping protection, plus lock-free 24-bit TPDF dithering on DSP-modified streams.
            - **CUE Sheet Splitting & Auto-Scan**: Automatic splitting of monolithic FLAC/WAV/APE/WV `.cue` albums and instant library updates for downloaded tracks.
            - **Pill-Free Studio UI & New Icon**: Redesigned Now Playing, Equalizer (0.1 dB bipolar sliders + `0 dB`-anchored curve), Home, Cloud, and Monochrome Carbon vector icon.
            - **Ultra-Lean 6.5 MB Release APK**: R8 code & resource shrinking (`arm64-v8a`).

            ### 📥 Download
            Download and install **`veyl-release.apk`** from the Assets below.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            app/build/outputs/apk/release/veyl-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
