[package]
name = "audiophile-core"
version = "0.1.0"
edition = "2021"
authors = ["Audiophile Team"]
description = "High-performance, bit-perfect audio core for Android"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
name = "audiophile_core"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
# Symphonia Audio Decoding (FLAC, ALAC, WAV, MP3, AAC, Vorbis, Opus)
symphonia = { version = "0.5.4", features = ["all"] }

# Lofty Audio Tagging & Metadata
lofty = "0.21.1"

# High-Quality Resampling
rubato = "0.16.1"

# Concurrency & Data Structures
parking_lot = "0.12.3"
crossbeam-channel = "0.5.13"
ringbuf = "0.4.7"

# Logging
log = "0.4.22"
android_logger = "0.14.1"

# Error Handling
thiserror = "1.0.63"

# Math
num-complex = "0.4.6"
rand = "0.8.5"

# UniFFI for Kotlin bindings
uniffi = { version = "0.28.3", features = ["cli", "tokio"] }
tokio = { version = "1.40.0", features = ["sync", "rt"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
oboe = { version = "0.6.1", features = ["shared-stdcxx"] }
ndk = "0.9.0"

[target.'cfg(not(target_os = "android"))'.dependencies]
# Desktop testing backend
cpal = "0.15.3"

[build-dependencies]
uniffi = { version = "0.28.3", features = ["build"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
